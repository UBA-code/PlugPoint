<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./public/map-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charge.ma | Interactive Map</title>
    <meta name="description" content="A premium interactive map of Morocco built with Leaflet.js and Vite." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS from CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <!-- Turf.js for Geographic Analysis -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <!-- Custom Style -->
    <link rel="stylesheet" href="./css/style.css">

  </head>
  <body>
    <div id="app">
      <header class="glass-header">
        <div dir="ltr">
          <h1>Charge.Ma</h1>
        </div>
        <div class="header-actions">
          <button id="toggle-route" class="action-btn" data-i18n="routeBtn">🛣️ Route</button>
          <button id="car-mode-btn" class="action-btn" data-i18n="carMode">🚘 Car Mode</button>
          <div class="lang-switcher">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="fr">FR</button>
            <button class="lang-btn" data-lang="ar">AR</button>
          </div>
        </div>
      </header>

      <div id="route-panel" class="glass-panel hide">
        <div class="panel-header">
          <h2 data-i18n="routePlanner">Route Planner</h2>
          <button id="close-panel" class="close-btn">✕</button>
        </div>
        <div class="panel-body">
          <div class="input-group">
            <label data-i18n="startPoint">Start Point</label>
            <div class="input-with-icon">
              <input type="text" id="start-input" data-i18n-placeholder="inputPlaceholder" placeholder="City, station or click map..." autocomplete="off">
              <button class="map-pick-btn" id="pick-start" data-i18n-title="pickMap" title="Pick from map">📍</button>
            </div>
            <div id="start-results" class="search-results"></div>
          </div>
          <div class="input-group">
            <label data-i18n="destination">Destination</label>
            <div class="input-with-icon">
              <input type="text" id="end-input" data-i18n-placeholder="inputPlaceholder" placeholder="City, station or click map..." autocomplete="off">
              <button class="map-pick-btn" id="pick-end" data-i18n-title="pickMap" title="Pick from map">🏁</button>
            </div>
            <div id="end-results" class="search-results"></div>
          </div>
          <button id="calculate-route" class="ocm-btn" data-i18n="findRoute">Find Route</button>
          
          <div id="route-info" class="route-info hide">
            <div class="route-stat">
              <span class="label" data-i18n="distance">Distance</span>
              <span id="route-dist" class="value">- km</span>
            </div>
            <div class="route-stat">
              <span class="label" data-i18n="stationsNearby">Stations (5km)</span>
              <span id="nearby-count" class="value">-</span>
            </div>
            <button id="clear-route" class="secondary-btn" data-i18n="clear">Clear</button>
          </div>
        </div>
      </div>

      <div id="car-mode-panel" class="car-mode-panel hide">
        <div class="car-header">
          <h2 data-i18n="carMode">🚘 Car Mode</h2>
          <button id="exit-car-mode" class="car-exit-btn">✕ <span data-i18n="exitCarMode">Exit</span></button>
        </div>
        <div id="car-stations-list" class="car-stations-list"></div>
      </div>

      <div id="map"></div>
    </div>
    <!-- Leaflet JS from CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="./js/translations.js?v=2"></script>
    <script src="./js/config.js?v=2"></script>
    <script src="./js/i18n.js?v=2"></script>
    <script src="./js/main.js?v=2"></script>

  </body>
</html>
